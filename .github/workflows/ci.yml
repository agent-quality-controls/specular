name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
      - name: Help
        run: cargo run -- --help
      - name: Version
        run: python3 scripts/verify-cli-version.py
      - name: Package smoke test
        run: cargo package --no-verify
      - name: Install Fixture3
        run: |
          cargo install cargo-binstall --locked
          cargo binstall fixture3 --no-confirm
      - name: Fixture3
        run: fixture3 check --all
      - name: README prose
        run: npx --yes slopless README.md
