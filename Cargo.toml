[package]
name = "specular"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic spec-driven development CLI"
license = "MIT"
repository = "https://github.com/agent-quality-controls/specular"
readme = "README.md"
keywords = ["cli", "spec", "agents", "verification", "json"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  "README.md",
  "src/**",
  "HELP.txt",
]

[dependencies]
aqc-cargo-toml-engine = "0.1.0"
aqc-file-engine-core = "0.3.1"
aqc-filetree = "0.1.0"
aqc-fs-utils = "0.1.0"
aqc-git-helpers = "0.1.0"
aqc-rust-syntax = "0.1.0"
camino = "1.2.2"
garde = { version = "0.23.0", features = ["derive"] }
globset = "0.4.18"
jsonschema = { version = "0.46.5", default-features = false }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
toml_edit = "0.25.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
