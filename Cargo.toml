[package]
name = "spec3"
version = "0.2.0"
edition = "2024"

[dependencies]
aqc-filetree = { version = "0.1.0", path = "../aqc-shared/packages/aqc-filetree" }
aqc-fs-utils = { version = "0.1.0", path = "../aqc-shared/packages/aqc-fs-utils" }
aqc-git-helpers = { version = "0.1.0", path = "../aqc-shared/packages/aqc-git-helpers" }
camino = "1.2.2"
garde = { version = "0.23.0", features = ["derive"] }
globset = "0.4.18"
jsonschema = { version = "0.46.5", default-features = false }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
